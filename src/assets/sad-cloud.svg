<svg width="100%" height="100%" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <g id="sad-cloud">
    <!-- Cloud body (brand blue) -->
    <path id="cloud" fill-rule="evenodd" clip-rule="evenodd"
      d="M35.2 18.4C34.3 18.4 33.4 18.5 32.6 18.8C32.9 18.1 33 17.4 33 16.6C33 13.5 30.5 11 27.4 11C25.6 11 24 11.9 22.9 13.3C22 10.3 19.2 8.1 15.9 8.1C11.8 8.1 8.5 11.4 8.5 15.5C8.5 16 8.6 16.6 8.7 17.1C5.4 18 3 21 3 24.6C3 28.9 6.5 32.4 10.8 32.4H35.2C39.1 32.4 42.2 29.3 42.2 25.4C42.2 21.5 39.1 18.4 35.2 18.4Z"
      fill="#4397ff"/>

    <!-- Sad face (white) -->
    <!-- Left eye -->
    <circle cx="18" cy="20" r="1.8" fill="#ffffff"/>
    <!-- Right eye -->
    <circle cx="28" cy="20" r="1.8" fill="#ffffff"/>
    <!-- Frowning mouth (arc curving downward at the ends) -->
    <path d="M18 28.5C19.8 25.8 26.2 25.8 28 28.5"
      stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none"/>

    <!-- Raindrops (brand blue), falling at a 60 degree angle to the left.
         Each teardrop is drawn vertically then rotated so it leans left as it falls. -->
    <g fill="#4397ff">
      <path d="M12 38C12 38 10.2 40.1 10.2 41.3C10.2 42.3 11 43 12 43C13 43 13.8 42.3 13.8 41.3C13.8 40.1 12 38 12 38Z"
        transform="rotate(60 12 40.5)"/>
      <path d="M22 40C22 40 20.2 42.1 20.2 43.3C20.2 44.3 21 45 22 45C23 45 23.8 44.3 23.8 43.3C23.8 42.1 22 40 22 40Z"
        transform="rotate(60 22 42.5)"/>
      <path d="M32 38C32 38 30.2 40.1 30.2 41.3C30.2 42.3 31 43 32 43C33 43 33.8 42.3 33.8 41.3C33.8 40.1 32 38 32 38Z"
        transform="rotate(60 32 40.5)"/>
      <path d="M42 40C42 40 40.2 42.1 40.2 43.3C40.2 44.3 41 45 42 45C43 45 43.8 44.3 43.8 43.3C43.8 42.1 42 40 42 40Z"
        transform="rotate(60 42 42.5)"/>
    </g>
  </g>
</svg>
